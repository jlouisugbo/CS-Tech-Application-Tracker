name: Internship Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scraper
        run: |
          curl -X GET "${{ secrets.DEPLOY_URL }}/api/scrape?CRON_SECRET=${{ secrets.CRON_SECRET }}" \
            -f || echo "Scrape request sent"